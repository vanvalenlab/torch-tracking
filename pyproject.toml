[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=61.2']

[project]
name = 'torch-tracking'
description = 'Deep learning for nuclear tracking'
readme = 'README.md'
requires-python = '>=3.10'
dynamic = ['version']
keywords = [
    'cell tracking',
    'single-cell imaging',
    'deep learning',
    'torch',
    'pytorch',
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: Modified Apache Version 2',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering :: Single-cell Imaging',
    'Topic :: Scientific/Engineering :: Microscopy',
    'Topic :: Scientific/Engineering :: Deep Learning',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Image Analysis',
]

dependencies = [
    "ipython",
    "matplotlib",
    "opencv-python-headless",
    "scikit-image",
    "scipy",
    "torch",
    "torchvision",
    "tqdm",
    "torch-geometric",
    "pandas",
    "zarr>=3",
    "numcodecs",
    "tensorboard",
    "huggingface_hub"
]

[project.scripts]
torch-tracking-train = "torch_tracking.training:main"

[[project.authors]]
name = 'Van Valen Lab'
email = 'vanvalenlab@gmail.com'

[[project.maintainers]]
name = 'Van Valen Lab'
email = 'vanvalenlab@gmail.com'

[project.urls]
# Homepage = 
"Bug Tracker" = 'https://github.com/vanvalenlab/torch-tracking/issues'
# Documentation =
"Source Code" = 'https://github.com/vanvalenlab/torch-tracking'

[project.optional-dependencies]
test = [
    "pytest"
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "myst-nb",
]

[tool.setuptools]
include-package-data = false
packages = [
    "torch_tracking"
]
platforms = [
    'Linux',
    'Mac OSX',
    'Windows',
    'Unix',
]

[tool.setuptools.dynamic.version]
attr = 'torch_tracking.__version__'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "l0: pure functions, no model and no torch forward pass. Needs nothing.",
    "l1: model structural contracts using randomly initialized weights. Needs torch only.",
    "l2: end-to-end tracking on the synthetic fixture with the untrained checkpoint. Needs nothing beyond the repository.",
    "l3: accuracy guardrails against real weights and the real dataset. Needs an HF_TOKEN and DynamicNuclearNet-tracking; skipped when absent.",
]

[tool.ruff]
line-length = 110
target-version="py310"

[tool.ruff.lint]
exclude = ["*.ipynb"]
select = ["E", "F", "UP"]
