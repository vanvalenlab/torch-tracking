name: tests

# Runs only the layers that need no credentials and no dataset, so this workflow
# succeeds on pull requests from forks, where repository secrets are unavailable.
#
# The L3 accuracy layer is deliberately excluded: it needs gated HuggingFace weights
# and the DynamicNuclearNet-tracking dataset, which currently has no public
# distribution route at all. See tests/README.md and doc/model_access.md.
#
# No HF_TOKEN is provided to these jobs. That is intentional - it keeps the
# credential-free guarantee honest rather than assumed.

# Automatic triggers are intentionally disabled until the move of dataset
# distribution to HuggingFace is complete. Until then this runs only on demand,
# from the Actions tab or `gh workflow run tests.yml`. To enable it, restore:
#
#   push:
#     branches: [main]
#   pull_request:
#
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install from pyproject, not requirements.txt: the latter still pulls
          # deepcell_auth from git, which no code path reaches (doc/model_access.md).
          python -m pip install -e '.[test]'

      - name: Confirm no gated assets are present
        run: |
          test -z "${HF_TOKEN:-}" || { echo "HF_TOKEN should not be set in CI"; exit 1; }
          test ! -d "$HOME/.deepcell/tracking" || { echo "dataset unexpectedly present"; exit 1; }
          echo "clean environment confirmed: no credentials, no dataset"

      - name: Run credential-free layers
        run: pytest -m 'l0 or l1 or l2' -v

      - name: Confirm L3 skips rather than fails
        run: pytest -m l3 -rs
